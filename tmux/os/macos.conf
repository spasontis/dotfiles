# macOS. pbcopy/pbpaste есть в системе всегда — внешних зависимостей нет.
set -g copy-command 'pbcopy'

# Досыл буфера tmux в системный.
# Нужен потому, что OSC 52 от приложения tmux пересылает наружу только из
# ВИДИМОЙ панели прикреплённой сессии: скопированное в фоновом окне или в
# отцепленной сессии остаётся во внутреннем буфере tmux — оно видно всем
# панелям, но в системный буфер не попадает. Проверено 09.09.2026.
bind C-c run-shell 'tmux show-buffer | pbcopy' \; display-message "Буфер tmux → системный"

# Вставка системного буфера в панель.
# -p: обернуть вставку в маркеры bracketed paste, ЕСЛИ приложение их просило.
# Без этого многострочный текст приезжает в TUI голыми переводами строк, и
# Claude Code отправляет его как несколько отдельных сообщений вместо одного.
# Проверено 11.09.2026: -p добавляет маркеры только когда режим включён, в
# обычный шелл вставка уходит нетронутой — то есть флаг безопасен всегда.
bind C-v run-shell 'tmux set-buffer -- "$(pbpaste)"; tmux paste-buffer -p'
