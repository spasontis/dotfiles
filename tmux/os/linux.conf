# Нативный Linux. Утилита буфера зависит от сессии: Wayland — wl-copy,
# X11 — xclip. Выбираем ту, что есть, а не фиксируем одну.
#
# Если нет ни одной — типичный случай сервера, куда ходят по SSH, — оставляем
# copy-command пустым СОЗНАТЕЛЬНО: тогда copy-pipe наполняет только буфер
# tmux, а наружу текст уходит через OSC 52 (set-clipboard on в базе), и его
# принимает уже терминал на стороне клиента. Отдельного «remote»-профиля для
# этого не нужно: удалённость — это отсутствие утилиты, а не сорт машины.
if-shell 'command -v wl-copy >/dev/null 2>&1' {
  set -g copy-command 'wl-copy'
  bind C-c run-shell 'tmux show-buffer | wl-copy' \; display-message "Буфер tmux → системный"
  # -p: обернуть вставку в маркеры bracketed paste, ЕСЛИ приложение их просило.
  # Без этого многострочный текст приезжает в TUI голыми переводами строк, и
  # Claude Code отправляет его как несколько отдельных сообщений вместо одного.
  # Проверено 11.09.2026: -p добавляет маркеры только когда режим включён, в
  # обычный шелл вставка уходит нетронутой — то есть флаг безопасен всегда.
  bind C-v run-shell 'tmux set-buffer -- "$(wl-paste --no-newline)"; tmux paste-buffer -p'

  # Средняя кнопка вставляет СИСТЕМНЫЙ буфер, а не внутренний.
  # mouse on заставляет tmux перехватывать мышь, и штатная средняя кнопка
  # терминала (вставка PRIMARY) до него уже не доходит, а tmux по умолчанию
  # вставляет собственный буфер — то есть скопированное вне tmux войти не может:
  # OSC 52 односторонний, терминалы не дают ЧИТАТЬ буфер. wl-paste/xclip -out
  # закрывают эту дыру, поэтому биндинг живёт здесь, рядом с copy-command, а не
  # в базе: на сервере без утилиты читать всё равно нечем.
  #
  # -t #{pane_id} раскрывается при нажатии: run-shell -b асинхронен, и без
  # привязки текст может уйти в панель, ставшую активной позже. Ветка с
  # mouse_any_flag оставляет клик приложению, которое само просит мышь.
  bind -n MouseDown2Pane select-pane -t = \; if -F '#{||:#{pane_in_mode},#{mouse_any_flag}}' { send-keys -M } { run-shell -b 'wl-paste -n | tmux load-buffer - ; tmux paste-buffer -p -d -t #{pane_id}' }
}

if-shell '! command -v wl-copy >/dev/null 2>&1 && command -v xclip >/dev/null 2>&1' {
  set -g copy-command 'xclip -selection clipboard -in'
  bind C-c run-shell 'tmux show-buffer | xclip -selection clipboard -in' \; display-message "Буфер tmux → системный"
  # -p: обернуть вставку в маркеры bracketed paste, ЕСЛИ приложение их просило.
  # Без этого многострочный текст приезжает в TUI голыми переводами строк, и
  # Claude Code отправляет его как несколько отдельных сообщений вместо одного.
  # Проверено 11.09.2026: -p добавляет маркеры только когда режим включён, в
  # обычный шелл вставка уходит нетронутой — то есть флаг безопасен всегда.
  bind C-v run-shell 'tmux set-buffer -- "$(xclip -selection clipboard -out)"; tmux paste-buffer -p'

  # Средняя кнопка вставляет СИСТЕМНЫЙ буфер, а не внутренний.
  # mouse on заставляет tmux перехватывать мышь, и штатная средняя кнопка
  # терминала (вставка PRIMARY) до него уже не доходит, а tmux по умолчанию
  # вставляет собственный буфер — то есть скопированное вне tmux войти не может:
  # OSC 52 односторонний, терминалы не дают ЧИТАТЬ буфер. wl-paste/xclip -out
  # закрывают эту дыру, поэтому биндинг живёт здесь, рядом с copy-command, а не
  # в базе: на сервере без утилиты читать всё равно нечем.
  #
  # -t #{pane_id} раскрывается при нажатии: run-shell -b асинхронен, и без
  # привязки текст может уйти в панель, ставшую активной позже. Ветка с
  # mouse_any_flag оставляет клик приложению, которое само просит мышь.
  bind -n MouseDown2Pane select-pane -t = \; if -F '#{||:#{pane_in_mode},#{mouse_any_flag}}' { send-keys -M } { run-shell -b 'xclip -selection clipboard -out | tmux load-buffer - ; tmux paste-buffer -p -d -t #{pane_id}' }
}
