# WSL. Раскладку переключает Windows-хост, и WSLg присылает уже
# транслированный символ, а не скан-код: любой биндинг на конкретную
# латинскую букву ломается под ЙЦУКЕН, пока нет дубля на символ, который та
# же физическая клавиша даёт в русской раскладке. Другим машинам это не нужно.

# RU-раскладка (ЙЦУКЕН): дубли для той же физической клавиши
bind -r о resize-pane -D 5
bind -r л resize-pane -U 5
bind -r д resize-pane -R 5
bind -r р resize-pane -L 5

bind -r ь resize-pane -Z

# RU-раскладка (ЙЦУКЕН): дубли для той же физической клавиши
bind-key -T copy-mode-vi 'м' send -X begin-selection
bind-key -T copy-mode-vi 'н' send -X copy-pipe-and-cancel

# Системный буфер Windows.
set -g copy-command 'clip.exe'
bind C-c run-shell 'tmux show-buffer | clip.exe' \; display-message "Буфер tmux → системный"
# Get-Clipboard отдаёт строки с CRLF — \r убираем, иначе вставка рвёт строку.
# -p: обернуть вставку в маркеры bracketed paste, ЕСЛИ приложение их просило.
# Без этого многострочный текст приезжает в TUI голыми переводами строк, и
# Claude Code отправляет его как несколько отдельных сообщений вместо одного.
# Проверено 11.09.2026: -p добавляет маркеры только когда режим включён, в
# обычный шелл вставка уходит нетронутой — то есть флаг безопасен всегда.
bind C-v run-shell 'tmux set-buffer -- "$(powershell.exe -NoProfile -Command Get-Clipboard | tr -d "\r")"; tmux paste-buffer -p'
