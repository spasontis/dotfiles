# WSL. Только системный буфер Windows.
#
# Здесь стояли дубли биндингов под ЙЦУКЕН с пометкой «другим машинам это не
# нужно» — неверно: символ вместо клавиши терминал отдаёт tmux везде
# одинаково, и WSL ничем не особенный. Дубли переехали в базу и делаются
# зеркалом (tmux/ru-layout.sh), сразу для всех буквенных биндингов.

# Системный буфер Windows.
set -g copy-command 'clip.exe'
bind C-c run-shell 'tmux show-buffer | clip.exe' \; display-message "Буфер tmux → системный"
# Get-Clipboard отдаёт строки с CRLF — \r убираем, иначе вставка рвёт строку.
# -p: обернуть вставку в маркеры bracketed paste, ЕСЛИ приложение их просило.
# Без этого многострочный текст приезжает в TUI голыми переводами строк, и
# Claude Code отправляет его как несколько отдельных сообщений вместо одного.
# Проверено 11.09.2026: -p добавляет маркеры только когда режим включён, в
# обычный шелл вставка уходит нетронутой — то есть флаг безопасен всегда.
bind C-v run-shell 'tmux set-buffer -b _sysclip -- "$(powershell.exe -NoProfile -Command Get-Clipboard | tr -d "\r")"; tmux paste-buffer -b _sysclip -p -d'
