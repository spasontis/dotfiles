# WSL guest: keyboard layout is switched at the Windows-host level, so
# WSLg forwards the already-translated character instead of a raw
# scancode/keysym. Any binding keyed on a specific Latin letter breaks
# under a non-Latin (RU/ЙЦУКЕН) layout unless a duplicate binding is added
# for the character that layout produces on the same physical key.

# RU-раскладка (ЙЦУКЕН): дубли для той же физической клавиши
bind -r о resize-pane -D 5
bind -r л resize-pane -U 5
bind -r д resize-pane -R 5
bind -r р resize-pane -L 5

bind -r ь resize-pane -Z

# RU-раскладка (ЙЦУКЕН): дубли для той же физической клавиши
bind-key -T copy-mode-vi 'м' send -X begin-selection
bind-key -T copy-mode-vi 'н' send -X copy-selection
