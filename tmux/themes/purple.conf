# Тема: светлым по тёмно-фиолетовому.
# Цвета из палитры 256: у tmux здесь нет RGB для внешнего терминала, и
# #RRGGBB он всё равно свёл бы к ближайшему из неё. colour54 — #5f0087.
# @theme_fg и @theme_bg читает заголовок панели Claude Code (.tmux.conf).
set -g status-style "bg=colour54,fg=colour255"
set -g @theme_fg colour255
set -g @theme_bg colour54
