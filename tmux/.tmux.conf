# TERM, который видят приложения ВНУТРИ панели. Не путать с terminal-features:
# те описывают внешний терминал, а это — то, чем tmux представляется программам
# у себя внутри.
#
# Стоявший здесь screen-256color в terminfo не описывает ни bracketed paste
# (BE/BD), ни курсив (sitm) — проверяется через `infocmp -x`. Программа, которая
# перед включением режима вставки сверяется с terminfo, внутри tmux решает, что
# терминал так не умеет, и режим не включает; обёрнутая терминалом вставка
# доезжает до неё сырой и печатается буквально — тот самый ^[[200~ в начале
# строки. У tmux-256color курсив есть; с bracketed paste всё зависит от базы
# terminfo — см. оговорку 3 в конце файла, на этой машине BE/BD там нет.
#
# Через if-shell, потому что TERM уезжает по ssh: на хосте со старым ncurses,
# где этого terminfo нет, приложения ругаются «terminal not fully functional».
# Берём tmux-256color только если он реально есть локально.
#
# Применяется к НОВЫМ панелям: у уже открытых TERM выставлен при запуске.
if-shell 'infocmp tmux-256color >/dev/null 2>&1' \
  'set -g default-terminal tmux-256color' \
  'set -g default-terminal screen-256color'

# Основной префикс
set -g prefix C-a

# Сортировка по имени
bind s choose-tree -sZ -O name

# Новая сессия (с запросом имени)
bind N command-prompt -p "New session name:" "new-session -s '%%'"

# Изменение индексов
set -g base-index 1
setw -g pane-base-index 1

# Переназначение клавиш
unbind %
bind \\ split-window -h

unbind '"'
bind - split-window -v

unbind r
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5

bind -r m resize-pane -Z

set -g mouse on

# Plugins (TPM)
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @continuum-restore 'on'
set -g @continuum-save-interval '10'

run '~/.tmux/plugins/tpm/tpm'

set-window-option -g mode-keys vi

# ── Буфер обмена ────────────────────────────────────────────────────────────
# Механика здесь общая для всех машин, а КУДА писать — решает профиль ОС
# (os/*.conf) через copy-command. Так платформенное не течёт в базу.
#
# set-clipboard on делает две вещи: принимает OSC 52 от приложений внутри
# панели (vim, Claude Code) и пересылает последовательность наружу в терминал.
# На хосте без своей утилиты буфера — например на сервере по SSH — это
# единственный путь текста наружу, поэтому опция в базе, а не в профиле.
set -g set-clipboard on

# copy-pipe без аргумента берёт copy-command и кладёт текст сразу в оба
# буфера: внутренний tmux и системный. Если copy-command пуст (сервер без
# wl-copy/xclip), остаётся только буфер tmux плюс OSC 52 — деградация мягкая.
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-pipe-and-cancel
bind-key -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel

# Обычное выделение мышью должно работать в ЛЮБОЙ панели, включая TUI,
# которые сами просят мышь (vim, htop, mc). По умолчанию tmux в этих трёх
# биндингах отдаёт таким панелям drag целиком (#{mouse_any_flag} → send -M),
# и выделение до tmux не доходит вовсе — текст никуда не копируется.
# Ветку с mouse_any_flag убираем. Клик и колесо намеренно оставлены
# приложению: иначе ломается его интерфейс и прокрутка.
#
# ИСКЛЮЧЕНИЕ — Claude Code. С ключом "tui": "fullscreen" в
# ~/.claude/settings.json он ведёт себя не как остальные TUI. Проверено
# 18.09.2026 на 2.1.276:
#
#   • панель уходит в alternate screen (?1049), и истории у неё нет:
#     #{history_size} 1–6 строк при history-limit 50000. Значит copy-mode
#     видит только текущий экран, а прокрутить назад в нём нечего — всё,
#     что уехало вверх, для tmux не существует;
#   • Claude в этом режиме держит СВОЮ прокрутку и своё выделение мышью и
#     копирует выделенное сразу (настройка copyOnSelect, по умолчанию
#     включена), причём тремя путями сразу: pbcopy, tmux load-buffer -w и
#     OSC 52 — то есть и из фоновой панели тоже;
#   • отбирая drag, мы эту его механику глушим целиком и меняем на copy-mode
#     без истории. Двойной клик у него же раскрывает свёрнутый вывод.
#
# Поэтому drag и двойной/тройной клик отдаём Claude, всем остальным — нет.
# Что НЕ проверено: сам жест мышью — правка сделана разбором конфигурации и
# бинаря, вживую перетаскиванием не прогонялась.
#
# Панель опознаём по имени процесса. Нативный установщик запускает бинарь
# ~/.local/share/claude/versions/<версия>, и в #{pane_current_command} видно
# имя файла: 2_1_276 (точки tmux показывает подчёркиваниями). Ветка claude —
# на случай установки через npm, где процесс называется иначе.
#
# alternate_on в условии обязателен: исключение нужно только полноэкранному
# режиму. В обычном (/tui default) Claude рисует в нормальный экран, всё
# уходит в историю tmux, и выделение должно остаться за tmux, как у всех.
%hidden CLAUDE_PANE="#{&&:#{alternate_on},#{m/r:^(claude|[0-9]+_[0-9]+_[0-9]+)$,#{pane_current_command}}}"

bind -n MouseDrag1Pane if -F "#{||:#{pane_in_mode},${CLAUDE_PANE}}" { send -M } { copy-mode -M }
bind -n DoubleClick1Pane select-pane -t = \; if -F "#{||:#{pane_in_mode},${CLAUDE_PANE}}" { send -M } { copy-mode -H ; send -X select-word ; run -d 0.3 ; send -X copy-pipe-and-cancel }
bind -n TripleClick1Pane select-pane -t = \; if -F "#{||:#{pane_in_mode},${CLAUDE_PANE}}" { send -M } { copy-mode -H ; send -X select-line ; run -d 0.3 ; send -X copy-pipe-and-cancel }

# Аварийный сброс режима вставки (prefix P).
#
# TUI — vim, fzf, Claude Code — включает bracketed paste при старте и обязан
# выключить при выходе. Убитый по kill или упавший этого не делает, и терминал
# продолжает оборачивать вставку маркерами, которых следующая программа уже не
# ждёт: в начале вставленной строки появляется ^[[200~, а сам ESC съедается как
# нажатие Escape. Гасит режим в панели, не перезапуская её.
#
# Пишем последовательность в pane_tty: для tmux это выглядит как вывод самой
# программы, он снимает флаг с панели и следом обновляет состояние внешнего
# терминала. Проверено 11.09.2026 — вставка после сброса приходит без маркеров.
bind P run-shell 'printf "\033[?2004l" > #{pane_tty}' \; display-message "bracketed paste сброшен"

# ── Рассылка в панели Claude Code ───────────────────────────────────────────
# Prefix+B печатает одну строку во ВСЕ claude-панели текущего окна.
#
# Именно текущего: list-panes -a достал бы и claude в других окнах и сессиях,
# а «повторить это везде» на практике почти никогда не значит этого.
#
# #{window_id} раскрывается в момент нажатия, а не когда стартует скрипт:
# run-shell -b асинхронен, активное окно за это время может уехать. Передаём
# id аргументом — рассылка уйдёт в то окно, на которое человек смотрел.
#
# confirm-before, потому что /clear необратим и летит сразу в несколько
# сессий. Не нужен вопрос — убрать обёртку, оставив run-shell.
#
# Чего скрипт не видит: панель, стоящая на диалоге разрешений, прочитает
# завершающий Enter как «принять подсвеченный вариант». Стоит взглянуть.
bind B confirm-before -p "разослать /clear во все claude-панели этого окна? (y/n)" \
  'run-shell -b "~/dotfiles/tmux/claude-broadcast.sh #{window_id} /clear"'

# ── Выделение строки ввода Claude Code ──────────────────────────────────────
# Prefix+a ставит выделение ровно по тексту строки ввода: без линеек рамки,
# без маркера «❯» и без хвостовых пробелов, которыми панель добита справа.
# Дальше y копирует в буфер ОС, Escape выходит — как у выделения мышью.
# Разметка строки ввода, способ её опознать и оговорки — в шапке скрипта.
#
# Клавишу занимал last-window: tmux-sensible биндит на last-window префикс без
# Ctrl, а префикс здесь C-a. Биндинг стоит ПОСЛЕ run с tpm, иначе плагин
# перекроет его обратно при каждой загрузке конфига.
bind a run-shell -b '~/dotfiles/tmux/claude-select-input.sh #{pane_id}'

# ── Смена раскладки набранного текста ───────────────────────────────────────
# Prefix+Tab переводит уже набранное в строке ввода Claude Code из одной
# раскладки в другую: «ghbdtn» становится «привет» и обратно. Направление
# скрипт берёт из самого текста, отдельной отмены нет и не нужно — повторное
# нажатие возвращает как было. Ввод, перенесённый на вторую строку, скрипт
# намеренно не трогает, причина — в его шапке.
#
# Tab, а не буква: эта клавиша одна в обеих раскладках, дубля в зеркале ей не
# нужно (ru-layout.sh зеркалит только буквы), и работает она в тот момент,
# когда раскладка заведомо не та. В таблице prefix Tab не занят ничем.
bind Tab run-shell -b '~/dotfiles/tmux/claude-switch-layout.sh #{pane_id}'

# ── Чего этим конфигом не починить ──────────────────────────────────────────
# Записано, чтобы не искать заново. Всё проверено 17.09.2026.
#
# 1. ЧИТАТЬ системный буфер через OSC 52 нельзя, и это не наша настройка:
#    у Alacritty osc52 по умолчанию OnlyCopy — писать приложение может, читать
#    нет. Поэтому bind C-v в os/*.conf берёт буфер утилитой ОС, а не escape-ом.
#    Умолчание не трогаем: чтение буфера смог бы кто угодно, в том числе
#    процесс на чужом сервере по ssh, а взамен не появляется ничего нового.
#    Запись при этом работает: OSC 52 из видимой панели доезжает до системного
#    буфера, проверено пробоем насквозь.
#
# 2. Досыл из фоновой панели (bind C-c в os/macos.conf) автоматом не сделать.
#    Хука на ПРИХОД OSC 52 у tmux нет: after-set-buffer срабатывает на команду
#    set-buffer и молчит на escape от приложения — проверено хуком с записью в
#    файл, 0 срабатываний. Пока остаётся руками.
#
# 3. Оговорка к default-terminal в начале файла. На macOS баз terminfo две:
#    системная у Apple (/usr/share/terminfo, ncurses 5.7) и своя у homebrew.
#    У Apple в tmux-256color нет ни BE/BD, ни Ms; у homebrew есть все три.
#    Значит переключение вверху помогает приложениям, собранным с homebrew-
#    ncurses, и не помогает тем, что берут системный. Проверить на конкретной
#    машине: infocmp -1 -x tmux-256color | grep -E 'BE|BD|Ms'.
#    На Mac Studio проверено 18.09.2026: homebrew-terminfo не установлен
#    вовсе, infocmp берёт /usr/share/terminfo/74/tmux-256color, и BE/BD/Ms
#    там нет — переключение вверху даёт здесь только курсив.
#    zsh это не касается вовсе — он шлёт ESC[?2004h всегда, terminfo не
#    спрашивая (замерено под pty).
#
# 4. Полноэкранный Claude Code (settings.json "tui": "fullscreen") уводит
#    панель в alternate screen, а туда история tmux не пишется: #{history_size}
#    у таких панелей 1–6 строк. Ни prefix [, ни capture-pane, ни поиск по
#    истории не достанут то, что уехало вверх, — его для tmux просто нет.
#    Лечится не конфигом, а режимом: /tui default возвращает вывод в обычный
#    экран и всю историю вместе с ним. Внутри fullscreen прокрутка и выделение
#    свои, у самого Claude (см. блок про мышь выше), плюс /copy [N] и /export.

# ── Профиль ОС (см. dotfiles/tmux/os/) ──────────────────────────────────────
# Порядок обязателен: WSL проверяется до Linux, потому что WSL — тоже Linux
# и иначе заберёт его ветку. Определяется на каждой загрузке конфига, в том
# числе при prefix r, отдельного шага установки не нужно.
if-shell '[ "$(uname -s)" = Darwin ]' \
  "source-file ~/dotfiles/tmux/os/macos.conf"
if-shell 'grep -qi microsoft /proc/version 2>/dev/null' \
  "source-file ~/dotfiles/tmux/os/wsl.conf"
if-shell '[ "$(uname -s)" = Linux ] && ! grep -qi microsoft /proc/version 2>/dev/null' \
  "source-file ~/dotfiles/tmux/os/linux.conf"

# ── Русская раскладка ───────────────────────────────────────────────────────
# Зеркало всех буквенных биндингов в ЙЦУКЕН. Списка дублей руками здесь нет
# намеренно: он отстаёт от конфига молча. Скрипт снимает список у самого tmux,
# поэтому дубль появляется сразу и у новых биндингов, и у умолчаний tmux.
# Подробности и оговорки — в шапке скрипта.
#
# Строкой ниже, потому что зеркалить нужно ПОСЛЕ того, как забиндено всё
# остальное, включая профиль ОС.
run-shell '~/dotfiles/tmux/ru-layout.sh'
