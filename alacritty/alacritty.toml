import = ["~/dotfiles/alacritty/os/current.toml"]

[env]
TERM = "xterm-256color"

[selection]
save_to_clipboard = true

# Секции [terminal] здесь нет намеренно: умолчание osc52 = "OnlyCopy" —
# приложение может ПИСАТЬ в системный буфер escape-последовательностью, но не
# читать его. На CopyPaste не переводим: читать буфер смог бы кто угодно, в том
# числе процесс на чужом сервере по SSH, а взамен не появляется ничего, чего не
# делает bind C-v в tmux (он берёт буфер утилитой ОС — pbpaste/wl-paste/xclip).
# Запись работает и проверена 17.09.2026: OSC 52 из видимой панели tmux доезжает
# до системного буфера.

[window]
padding.x = 20
padding.y = 20

decorations = "ButtonLess"
opacity = 0.92
blur = true

[font]
size = 14.0
