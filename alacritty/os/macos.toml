# macOS. Копирование и вставка здесь работают из коробки на Cmd+C / Cmd+V —
# это системный жест, его переопределять не нужно. Дубли на Ctrl+Shift+C/V
# оставлены ради единой мышечной памяти с Linux и WSL.
#
# По скан-кодам, как в wsl.toml, здесь биндить не надо: macOS отдаёт
# Alacritty символ уже с учётом раскладки.
#
# Раскладка РЕШАЕТ, какой символ приедет, и для Command тоже. Стоявшее здесь
# «модификатор Control|Shift сохраняет латинскую букву» — единственное место в
# конфигах, где утверждение не было проверено, и оно неверно: Alacritty
# сопоставляет биндинг по СИМВОЛУ, а при русской раскладке физическая V даёт
# «м», и ни один биндинг не совпадает. Отсюда «Cmd+V ничего не вставляет»,
# когда в момент нажатия включён русский — а он включён ровно тогда, когда
# пишешь в Claude по-русски. Дубли ниже закрывают оба жеста, как это уже
# сделано в linux.toml.
[keyboard]
bindings = [
  { key = "C", mods = "Control|Shift", action = "Copy" },
  { key = "V", mods = "Control|Shift", action = "Paste" },
  # RU-раскладка (ЙЦУКЕН): физические C/V печатают С/М
  { key = "С", mods = "Control|Shift", action = "Copy" },
  { key = "М", mods = "Control|Shift", action = "Paste" },
  { key = "С", mods = "Command", action = "Copy" },
  { key = "М", mods = "Command", action = "Paste" }
]
